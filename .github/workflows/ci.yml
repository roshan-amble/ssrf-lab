name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Record verification environment
        run: |
          mkdir -p verification
          { git rev-parse HEAD; node --version; npm --version; uname -srm; } | tee verification/environment.txt
      - name: Clean dependency installation
        run: npm ci 2>&1 | tee verification/install.txt
      - name: Gate dependency advisories with a narrow research-fixture exception
        run: |
          node --test scripts/check-audit.test.mjs | tee verification/audit-gate-tests.txt
          set +e
          npm audit --json > verification/dependency-audit.json
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then cat verification/dependency-audit.json; exit "$status"; fi
          node scripts/check-audit.mjs | tee verification/audit-gate.txt
      - name: Typecheck and compile
        run: |
          npm run typecheck 2>&1 | tee verification/typecheck.txt
          npm run build 2>&1 | tee verification/build.txt
          node --check scripts/demo.mjs
          node --test examples/custom-fetcher/adapter.test.mjs | tee verification/custom-fetcher-tests.txt
          python3 -m py_compile scripts/record-demo.py
      # Unsafe clients must not contact real metadata services or other networks.
      - name: Tests, compiled CLI, and real demo in a loopback-only network
        run: |
          sudo env "PATH=$PATH" unshare --net -- bash -euo pipefail -c '
            ip link set lo up
            ip -brief address | tee verification/network.txt
            npm test 2>&1 | tee verification/tests.txt
            node examples/late-error/demo.mjs | tee verification/late-error-demo.txt
            node dist/cli.js --help | tee verification/help.txt
            node dist/cli.js scan --client all --json > verification/builtins.json
            node dist/cli.js scan --client libs --suite direct --json > verification/libraries.json
            node dist/cli.js scan --client guarded --suite all --fail-on-reach --json > verification/guarded.json
            set +e
            node dist/cli.js scan --client plain --suite direct --fail-on-reach --json > verification/negative-control.json
            status=$?
            set -e
            test "$status" -eq 1
            printf "Unsafe-client gate returned expected exit status %s\n" "$status" | tee verification/negative-control.txt
            python3 scripts/record-demo.py verification/demo.cast
          '
      - name: Validate measured results and preserve readable tables
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          import { LEGEND, renderTable } from './dist/checker/report.js';
          const load = name => JSON.parse(readFileSync(`verification/${name}.json`, 'utf8'));
          const unsafe = load('negative-control').scans;
          assert(unsafe.length === 1 && unsafe[0].results.length === 7 && unsafe[0].reached > 0);
          const guarded = load('guarded').scans;
          assert(guarded.length === 1 && guarded[0].results.length === 17 && guarded[0].reached === 0);
          const libs = load('libraries').scans;
          assert.deepEqual(libs.map(s => [s.results.length, s.blocked, s.reached]), [[7, 7, 0], [7, 7, 0], [7, 5, 2]]);
          assert.deepEqual(libs[2].results.filter(r => r.verdict === 'REACHED').map(r => r.probeId), ['direct-zero-host', 'direct-ipv6-mapped']);
          assert.deepEqual(load('demo').measured.map(m => m.internalHits), [0, 0, 2]);
          for (const name of ['builtins', 'libraries', 'guarded']) {
            const report = `${LEGEND}\n${load(name).scans.map(renderTable).join('\n')}\n`;
            writeFileSync(`verification/${name}.txt`, report);
            console.log(report);
          }
          NODE
          npm ls --depth=0 2>&1 | tee verification/versions.txt
          echo 'FUNCTIONAL CHECKS AND AUDIT GATE PASSED; TWO RESEARCH-FIXTURE FINDINGS ARE EXCEPTED' | tee verification/RESULTS.txt
      - name: Preserve actual verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-node${{ matrix.node }}-${{ github.sha }}
          path: verification/
          if-no-files-found: error
          retention-days: 14

  integrations:
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            integrations/n8n/package-lock.json
            integrations/community/package-lock.json
      - name: Install pinned comparison packages without lifecycle scripts
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix integrations/n8n
          npm ci --ignore-scripts --prefix integrations/community
          npm run build
          mkdir -p verification
          { git rev-parse HEAD; node --version; npm --version; uname -srm; } | tee verification/environment.txt
          npm ls --depth=0 > verification/versions.txt
          npm ls --depth=0 --prefix integrations/n8n > verification/n8n-versions.txt
          npm ls --depth=0 --prefix integrations/community > verification/community-versions.txt
      - name: Audit the community comparison dependencies
        run: npm audit --prefix integrations/community --json > verification/community-audit.json
      - name: Prepare the pinned upstream redirect regression
        run: |
          git clone https://github.com/dfpc-coe/node-safeurl.git "$RUNNER_TEMP/node-safeurl"
          git -C "$RUNNER_TEMP/node-safeurl" checkout --detach 274efcee2c288e313335ef4043236d490724a4d9
          npm ci --ignore-scripts --prefix "$RUNNER_TEMP/node-safeurl"
          git -C "$RUNNER_TEMP/node-safeurl" apply "$GITHUB_WORKSPACE/patches/node-safeurl/redirect-body-headers.patch"
          # Keep the added tests but restore the original implementation first.
          git -C "$RUNNER_TEMP/node-safeurl" checkout -- lib/fetch.ts
      - name: Audit the separate n8n integration dependencies
        run: |
          node --test integrations/n8n/check-audit.test.mjs
          set +e
          npm audit --prefix integrations/n8n --json > verification/n8n-audit.json
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then cat verification/n8n-audit.json; exit "$status"; fi
          node integrations/n8n/check-audit.mjs verification/n8n-audit.json | tee verification/n8n-audit-gate.txt
      - name: Verify real requests with only loopback and an isolated entry address
        run: |
          sudo env "PATH=$PATH" unshare --net -- bash -euo pipefail -c '
            ip link set lo up
            ip address add 93.184.216.34/32 dev lo
            ip -j address show > verification/network.json
            ip -j route show table all > verification/routes.json
            node scripts/verify-vercel.mjs > verification/vercel.json
            node integrations/n8n/verify.mjs > verification/n8n.json
            node integrations/community/verify.mjs > verification/community.json
            node integrations/community/check-redirects.mjs > verification/node-safeurl-redirect-before.json
            node examples/custom-fetcher/check.mjs --isolated --json > verification/custom-fetcher.json
            set +e
            node examples/custom-fetcher/check.mjs --isolated --unsafe --json > verification/custom-fetcher-unsafe.json
            status=$?
            set -e
            test "$status" -eq 1
          '
      - name: Prove the upstream regression fails before the patch and passes after
        run: |
          sudo env "PATH=$PATH" "UPSTREAM_PATH=$RUNNER_TEMP/node-safeurl" "LAB_PATH=$GITHUB_WORKSPACE" unshare --net -- bash -euo pipefail -c '
            ip link set lo up
            cd "$UPSTREAM_PATH"
            set +e
            node --import tsx --test --test-reporter=tap test/redirect-body-headers.test.ts > "$LAB_PATH/verification/node-safeurl-regression-before.tap" 2>&1
            status=$?
            set -e
            test "$status" -eq 1
            git apply --include=lib/fetch.ts "$LAB_PATH/patches/node-safeurl/redirect-body-headers.patch"
            npm run lint > "$LAB_PATH/verification/node-safeurl-lint.txt" 2>&1
            npm run build > "$LAB_PATH/verification/node-safeurl-build.txt" 2>&1
            node --import tsx --test --test-reporter=tap test/redirect-body-headers.test.ts > "$LAB_PATH/verification/node-safeurl-regression-after.tap" 2>&1
            node --import tsx --test --test-reporter=tap test/*.ts > "$LAB_PATH/verification/node-safeurl-tests-after.tap" 2>&1
          '
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const before = readFileSync('verification/node-safeurl-regression-before.tap', 'utf8');
          const after = readFileSync('verification/node-safeurl-regression-after.tap', 'utf8');
          for (const [status, method] of [[301, 'POST'], [302, 'POST'], [303, 'PUT']]) {
            assert(before.includes(`${status} ${method} drops body headers`));
          }
          assert.match(before, /# pass 4\b/);
          assert.match(before, /# fail 4\b/); // Three regression cases plus their parent.
          assert.match(after, /# pass 8\b/);
          assert.match(after, /# fail 0\b/);
          NODE
      - name: Print measured comparison tables
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { renderTable } from './dist/index.js';
          for (const name of ['vercel', 'n8n', 'community']) {
            const report = JSON.parse(readFileSync(`verification/${name}.json`, 'utf8'));
            for (const scan of report.scans) console.log(renderTable(scan));
          }
          const onboarding = JSON.parse(readFileSync('verification/custom-fetcher.json', 'utf8'));
          if (onboarding.scan.blocked !== 9 || onboarding.scan.reached !== 0 || onboarding.exitCode !== 0 ||
              onboarding.scan.positiveControl.publicHits < 1 || onboarding.negativeControl.reached !== 2) {
            throw new Error('Custom-fetcher onboarding did not demonstrate its documented coverage');
          }
          console.log(renderTable(onboarding.scan));
          NODE
      - name: Preserve comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-verification-node${{ matrix.node }}-${{ github.sha }}
          path: verification/
          if-no-files-found: error
          retention-days: 14

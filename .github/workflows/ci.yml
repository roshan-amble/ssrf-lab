name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Record verification environment
        run: |
          mkdir -p verification
          {
            git rev-parse HEAD
            node --version
            npm --version
            uname -srm
          } | tee verification/environment.txt

      - name: Clean dependency installation
        run: npm ci 2>&1 | tee verification/install.txt

      # Deliberately vulnerable libraries are part of this research fixture.
      # Report advisories explicitly; functional CI is not a clean-audit claim.
      - name: Record dependency audit for review
        run: |
          set +e
          npm audit --json > verification/dependency-audit.json
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            cat verification/dependency-audit.json
            exit "$status"
          fi
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('verification/dependency-audit.json', 'utf8'));
          if (report.error || !report.metadata) throw new Error('Dependency audit did not return a valid report');
          const summary = {
            vulnerabilities: report.metadata.vulnerabilities,
            findings: Object.values(report.vulnerabilities ?? {}).map(item => ({
              name: item.name,
              severity: item.severity,
              isDirect: item.isDirect,
              range: item.range,
              via: item.via,
              fixAvailable: item.fixAvailable,
            })),
          };
          const text = JSON.stringify(summary, null, 2);
          writeFileSync('verification/dependency-summary.json', `${text}\n`);
          console.log(text);
          NODE

      - name: Typecheck
        run: npm run typecheck 2>&1 | tee verification/typecheck.txt

      - name: Build the distributed CLI
        run: npm run build 2>&1 | tee verification/build.txt

      # The lab's listeners are local, but its deliberately unsafe clients can
      # follow redirects to metadata/documentation addresses. Permit loopback
      # only: no external interface, route, metadata service, or real target.
      - name: Tests and compiled CLI scans in a loopback-only network
        run: |
          sudo env "PATH=$PATH" unshare --net -- bash -euo pipefail -c '
            ip link set lo up
            ip -brief address | tee verification/network.txt
            npm test 2>&1 | tee verification/tests.txt
            node dist/cli.js --help | tee verification/help.txt
            node dist/cli.js scan --client all --json | tee verification/builtins.json
            node dist/cli.js scan --client libs --suite direct --json | tee verification/libraries.json
            node dist/cli.js scan --client guarded --suite all --fail-on-reach --json | tee verification/guarded.json
            # Check that the CI gate actually fails for an unsafe client.
            set +e
            node dist/cli.js scan --client plain --suite direct --fail-on-reach --json > verification/negative-control.json
            status=$?
            set -e
            test "$status" -eq 1
            printf "Unsafe-client gate returned expected exit status %s\n" "$status" | tee verification/negative-control.txt
          '

      - name: Render measured scan tables
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { LEGEND, renderTable } from './dist/checker/report.js';
          for (const name of ['builtins', 'libraries', 'guarded']) {
            const { scans } = JSON.parse(readFileSync(`verification/${name}.json`, 'utf8'));
            const report = `${LEGEND}\n${scans.map(renderTable).join('\n')}\n`;
            writeFileSync(`verification/${name}.txt`, report);
            console.log(report);
          }
          NODE
          npm ls --depth=0 2>&1 | tee verification/versions.txt
          echo 'ALL FUNCTIONAL RELEASE CHECKS PASSED; SEE DEPENDENCY AUDIT SEPARATELY' | tee verification/RESULTS.txt

      - name: Preserve actual verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ github.sha }}
          path: verification/
          if-no-files-found: error
          retention-days: 14

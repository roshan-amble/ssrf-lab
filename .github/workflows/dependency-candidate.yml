name: dependency-candidate

# Temporary transfer of already-reviewed candidate files into Git blobs.
# Does not execute artifact code, update refs, commit, merge, or publish.
on:
  push:
    branches: [launch/release-verification]
    paths: [.github/workflows/dependency-candidate.yml]

permissions:
  contents: read

jobs:
  stage-verified-files:
    if: github.repository == 'roshan-amble/ssrf-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: write
    steps:
      - name: Verify and stage the exact reviewed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, urllib.request, zipfile
          repo = 'roshan-amble/ssrf-lab'
          api = 'https://api.github.com/repos/' + repo
          token = os.environ['GH_TOKEN']
          def request(url, data=None):
              req = urllib.request.Request(url, data=data, headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.read()
          archive = request(api + '/actions/artifacts/11720926725/zip')
          assert hashlib.sha256(archive).hexdigest() == 'd9c5451837fe6df683a74f56e25c9255e85a037335d51ed28c5e3738b84bcae1'
          with zipfile.ZipFile(io.BytesIO(archive)) as files:
              package = json.loads(files.read('package.json'))
              lock = json.loads(files.read('package-lock.json'))
              assert package['devDependencies']['vitest'] == '5.0.3'
              assert package['devDependencies']['ssrf-agent'] == '1.0.5'
              assert lock['packages']['node_modules/ip']['version'] == '1.1.9'
              for name in ['package.json', 'package-lock.json']:
                  content = files.read(name)
                  expected = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
                  body = json.dumps({'content': content.decode('utf-8'), 'encoding': 'utf-8'}).encode()
                  result = json.loads(request(api + '/git/blobs', body))
                  assert result['sha'] == expected
                  print(json.dumps({'path': name, 'sha': result['sha'], 'bytes': len(content)}))
          PY
